name: baerbel
version: 0.1.0.0
build-type: Custom
custom-setup:
  dependencies: [base >= 4.20, Cabal >= 3.10, directory >= 1.3, filepath >= 1.4]
license: NONE
synopsis: Functional telephone assistant
extra-source-files:
- config/global.json
- config/user.example.json
- test/fixtures/*.json
- cbits/phone_number.cpp
- native/phone-source.txt
- native/build-sources.txt
- native/licenses/*
- native/README.md
- scripts/*.sh
- deploy/*
- architecture/*.dot
- architecture/core-imports.txt
- architecture/render.sh
dependencies:
- base >= 4.20
- aeson >= 2.2
- async >= 2.2
- base64-bytestring >= 1.2
- binary >= 0.8
- bytestring >= 0.11
- containers >= 0.6
- crypton >= 1.0
- crypton-connection >= 0.4
- tls >= 2.0
- directory >= 1.3
- filepath >= 1.4
- http-client >= 0.7
- http-client-tls >= 0.3
- http-types >= 0.12
- memory >= 0.16
- mtl >= 2.2
- network >= 3.1
- process >= 1.6
- scientific >= 0.3
- sqlite-simple >= 0.4
- stm >= 2.5
- text >= 1.2
- text-icu >= 0.8
- temporary >= 1.3
- time >= 1.11
- transformers >= 0.5
- unix >= 2.8
- uuid >= 1.3
- vector >= 0.12
- websockets >= 0.12
- wuss >= 1.1
- wai >= 3.2
- warp >= 3.3
- case-insensitive >= 1.2
- cassava >= 0.5
- mime-mail >= 0.5
- tagsoup >= 0.14
- unicode-transforms >= 0.4
- regex-tdfa >= 1.3
- tz >= 0.1
- tzdata >= 0.2
default-extensions:
- OverloadedStrings
- DeriveGeneric
ghc-options:
- -Wall
- -Wcompat
- -Wmissing-signatures
- -Werror=missing-signatures
- -Wincomplete-uni-patterns
- -Wincomplete-record-updates
library:
  source-dirs: src
  extra-libraries: [baerbel-phone, baerbel-vad, stdc++, z]
executables:
  phone-assistant-server:
    main: Main.hs
    source-dirs: app
    other-modules: []
    dependencies: baerbel
    ghc-options: [-threaded, -rtsopts, -with-rtsopts=-N]
  phone-assistant-gmail-auth:
    main: AuthMain.hs
    source-dirs: app
    other-modules: []
    dependencies: baerbel
    ghc-options: [-threaded, -rtsopts]
tests:
  baerbel-test:
    main: Spec.hs
    source-dirs: test
    dependencies: [baerbel, hspec, QuickCheck]
    ghc-options: [-threaded, -rtsopts]
