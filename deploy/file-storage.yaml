defaults:
  PHONE_ASSISTANT_GMAIL_STATE_FILE: /var/lib/phone-assistant/gmail-sends.sqlite3
  PHONE_ASSISTANT_CALENDAR_STATE_FILE: /var/lib/phone-assistant/calendar-events.sqlite3
  PHONE_ASSISTANT_SMS_STATE_FILE: /var/lib/phone-assistant/sms-sends.sqlite3
  INCOMING_EVENTS_STATE_FILE: /var/lib/phone-assistant/incoming-events-cursor.sqlite3
paths:
- key: PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  when: null
  boolean: false
  existing: true
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
- key: PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  when: null
  boolean: false
  existing: true
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
- key: PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  when: null
  boolean: false
  existing: true
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
- key: PHONE_ASSISTANT_GMAIL_STATE_FILE
  when: PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  boolean: false
  existing: false
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
  - $global
  - $user
- key: PHONE_ASSISTANT_CALENDAR_STATE_FILE
  when: PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  boolean: false
  existing: false
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - $global
  - $user
- key: PHONE_ASSISTANT_SMS_STATE_FILE
  when: INCOMING_SMS_ENABLED
  boolean: true
  existing: false
  tilde: false
  pattern: ^/[A-Za-z0-9_./-]+$
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
  - INCOMING_EVENTS_FILE
  - INCOMING_EVENTS_STATE_FILE
  - $global
  - $user
  - PHONE_ASSISTANT_LOG_FILE
  - PHONE_ASSISTANT_PROFILE_FILE
- key: INCOMING_EVENTS_FILE
  when: INCOMING_SMS_ENABLED
  boolean: true
  existing: false
  tilde: false
  pattern: ^/[A-Za-z0-9_./-]+$
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
  - PHONE_ASSISTANT_SMS_STATE_FILE
  - INCOMING_EVENTS_STATE_FILE
  - $global
  - $user
  - PHONE_ASSISTANT_LOG_FILE
  - PHONE_ASSISTANT_PROFILE_FILE
- key: INCOMING_EVENTS_STATE_FILE
  when: INCOMING_SMS_ENABLED
  boolean: true
  existing: false
  tilde: false
  pattern: ^/[A-Za-z0-9_./-]+$
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
  - PHONE_ASSISTANT_SMS_STATE_FILE
  - INCOMING_EVENTS_FILE
  - $global
  - $user
  - PHONE_ASSISTANT_LOG_FILE
  - PHONE_ASSISTANT_PROFILE_FILE
- key: PHONE_ASSISTANT_PROFILE_FILE
  when: null
  boolean: false
  existing: false
  tilde: true
  pattern: null
  separate:
  - PHONE_ASSISTANT_GMAIL_TOKEN_FILE
  - PHONE_ASSISTANT_CALENDAR_TOKEN_FILE
  - PHONE_ASSISTANT_CONTACTS_TOKEN_FILE
  - PHONE_ASSISTANT_GMAIL_STATE_FILE
  - PHONE_ASSISTANT_CALENDAR_STATE_FILE
  - PHONE_ASSISTANT_SMS_STATE_FILE
  - INCOMING_EVENTS_FILE
  - INCOMING_EVENTS_STATE_FILE
  - $global
  - $user
  - PHONE_ASSISTANT_LOG_FILE
