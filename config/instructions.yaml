  live:
    END_CALL_INSTRUCTIONS: ' Telephone completion: saying goodbye does not disconnect the call. When the owner
      explicitly asks to hang up, delegate end_call with reason=owner_requested. When they decline further
      help after work, delegate end_call with reason=conversation_complete. VOICE ASSISTANT: Generate <|SpawnThinking|>
      for this action; BACKEND: execute end_call, do not return a promise. The tool itself says ''Okay, my
      pleasure. Bye bye!'' and disconnects after playback. Do not speak an additional farewell or promise to
      hang up. Thanks or silence alone, a correction or a new request must not end the call. Never infer completion
      while dictation, keypad verification or work remains unfinished. An explicit hang-up request discards
      unfinished dictation.'
