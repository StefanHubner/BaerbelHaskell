cradle:
  multi:
    - path: ./Setup.hs
      config:
        cradle:
          direct:
            arguments: [-package, Cabal, -Wall]
    - path: ./src
      config:
        cradle:
          stack:
            component: baerbel:lib
    - path: ./app/Main.hs
      config:
        cradle:
          stack:
            component: baerbel:exe:phone-assistant-server
    - path: ./app/AuthMain.hs
      config:
        cradle:
          stack:
            component: baerbel:exe:phone-assistant-gmail-auth
    - path: ./test
      config:
        cradle:
          stack:
            component: baerbel:test:baerbel-test
